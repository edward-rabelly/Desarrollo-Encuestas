<mat-sidenav-container class="sidenav-container">
  
  <!-- SIDEBAR -->
  <mat-sidenav
    #drawer
    class="sidenav"
    fixedInViewport
    [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) === false"
  > 
    <mat-toolbar>MENU</mat-toolbar>
    <mat-nav-list> 
      <a mat-list-item routerLink="/Usuario">Usuario</a>
      <a mat-list-item routerLink="/encuesta">Encuesta</a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- CONTENIDO PRINCIPAL -->
  <mat-sidenav-content>
    
    <!-- TOOLBAR SUPERIOR -->
    <mat-toolbar style="background-color: rgb(64, 218, 238);">
      
      @if (isHandset$ | async) {
        <button type="button" aria-label="Toggle sidenav" mat-icon-button (click)="drawer.toggle()">
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
        </button>
      }
      
      <span>Encuestas</span>
      <span class="spacer"></span>

      <!-- BOTÓN DE LOGIN -->
      <button 
        *ngIf="!usuarioLogueado" 
        mat-raised-button 
        style="background-color: white; color: rgb(64, 218, 238); font-weight: bold; margin-right: 10px;"
        (click)="abrirLogin()">
        Iniciar Sesión
      </button>

      <!-- AVATAR DEL USUARIO -->
      <app-avatar-usuario 
        *ngIf="usuarioLogueado" 
        (sesionCerrada)="onSesionCerrada()">
      </app-avatar-usuario>

    </mat-toolbar>

    <!-- CONTENIDO DE LAS RUTAS -->
    <div style="padding: 20px;">
      <router-outlet></router-outlet>

      <!-- 👇 TABLA GENÉRICA DINÁMICA (Como en las imágenes del profesor) 👇 -->
      <h3 style="margin: 30px 0 15px 0; color: #333;">Tabla Dinámica de Usuarios</h3>
      
      <table mat-table [dataSource]="data" class="mat-elevation-z8" style="width: 100%; background: white;">
        
        <!-- Columnas dinámicas con ng-container -->
        <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
          
          <!-- Header de la columna -->
          <th mat-header-cell *matHeaderCellDef>
            {{ column | titlecase }}
          </th>
          
          <!-- Celda de datos -->
          <td mat-cell *matCellDef="let element">
            {{ getPropertyValue(element, column) }}
          </td>
          
        </ng-container>

        <!-- Fila de cabecera -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        
        <!-- Fila de datos -->
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        
      </table>
    </div>

    <!-- MODAL DE LOGIN -->
    <app-login-modal 
      #modalLogin 
      (loginExitoso)="onLoginExitoso($event)">
    </app-login-modal>

  </mat-sidenav-content>
</mat-sidenav-container>
