<table mat-table [dataSource]="data" class="mat-elevation-z8">

  <ng-container *ngFor="let column of displayColumns" [matColumnDef]="column">
    
    <ng-container *ngIf="column === 'accion'; else defaultColumn">
      <th mat-header-cell *matHeaderCellDef> Accion </th>
      <td mat-cell *matCellDef="let element">
        <button (click)="onRowClick(element)">Ver Historial</button>
      </td>
    </ng-container>

    <ng-template #defaultColumn>
      <th mat-header-cell *matHeaderCellDef> {{ column | titlecase }} </th>
      <td mat-cell *matCellDef="let element"> {{ element[column] }} </td>
    </ng-template>
    
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayColumns;"></tr>

  <tr *ngIf="data.length === 0">
    <td [attr.colspan]="displayColumns.length">
      No hay datos disponibles
    </td>
  </tr>

</table>
