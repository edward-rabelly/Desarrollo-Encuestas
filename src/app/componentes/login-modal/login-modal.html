<!-- Overlay oscuro de fondo -->
<div class="modal-overlay" *ngIf="mostrarModal" (click)="cerrarModal()">
  
  <!-- Contenido del Modal -->
  <div class="modal-content" (click)="$event.stopPropagation()">
    
    <!-- Botón de cerrar con ícono -->
    <button mat-icon-button class="close-btn" (click)="cerrarModal()" aria-label="Cerrar modal">
      <mat-icon>close</mat-icon>
    </button>

    <h2 class="modal-title">{{ modo === 'login' ? 'Iniciar Sesión' : 'Registrarse' }}</h2>

    <!-- Pestañas para cambiar entre Login y Registro -->
    <div class="tabs">
      <button mat-button [color]="modo === 'login' ? 'primary' : ''" (click)="cambiarModo('login')">
        Iniciar Sesión
      </button>
      <button mat-button [color]="modo === 'registro' ? 'primary' : ''" (click)="cambiarModo('registro')">
        Registrarse
      </button>
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="enviarFormulario()" #loginForm="ngForm">

      <!-- CAMPOS EXCLUSIVOS DE REGISTRO -->
      <ng-container *ngIf="modo === 'registro'">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nombre completo</mat-label>
          <input matInput [(ngModel)]="usuario.nombre" name="nombre" required>
        </mat-form-field>

        <div class="form-row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Tipo Doc.</mat-label>
            <mat-select [(ngModel)]="usuario.tipo_documento" name="tipo_documento" required>
              <mat-option value="CC">CC</mat-option>
              <mat-option value="TI">TI</mat-option>
              <mat-option value="CE">CE</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Número</mat-label>
            <input matInput type="text" [(ngModel)]="usuario.numero_documento" name="numero_documento" required>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Edad</mat-label>
            <input matInput type="number" [(ngModel)]="usuario.edad" name="edad" required min="1">
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Género</mat-label>
            <mat-select [(ngModel)]="usuario.genero" name="genero" required>
              <mat-option value="Masculino">Masculino</mat-option>
              <mat-option value="Femenino">Femenino</mat-option>
              <mat-option value="Otro">Otro</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </ng-container>

      <!-- CAMPOS COMUNES (Login y Registro) -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Correo electrónico</mat-label>
        <input matInput type="email" [(ngModel)]="usuario.email" name="email" required email>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" [(ngModel)]="usuario.contrasena" name="contrasena" required>
      </mat-form-field>

      <!-- Mensaje de Error -->
      <p *ngIf="mensaje" class="error-message" [ngClass]="{'text-error': esError, 'text-success': !esError}">
        {{ mensaje }}
      </p>

      <!-- Botón de Enviar -->
      <button mat-raised-button color="primary" type="submit" class="full-width submit-btn" [disabled]="loginForm.invalid">
        {{ modo === 'login' ? 'Ingresar' : 'Crear Cuenta' }}
      </button>

    </form>
  </div>
</div>
