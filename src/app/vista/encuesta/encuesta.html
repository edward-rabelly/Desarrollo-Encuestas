
<div *ngIf="isLoading" class="loading-container"> <!-- es como una estructura fija,como un inteructor -->
  <mat-spinner></mat-spinner> 
  <p>Cargando encuestas...</p>
</div>


<div *ngIf="!isLoading" class="encuestas-lista">
  <app-tabla 
    [data]="dataSource" 
    [mostrarBoton]="true" 
    [textoBoton]="'Realizar Encuesta'" 
    [tituloColumnaAccion]="'Encuestas disponibles'"
    (filaSeleccionada)="realizarEncuesta($event)">
  </app-tabla>
</div>

 <!-- div es la estructura que va a tener lo que ponga adentro           -->
   <!-- la p es una etiqueta de html para un parrafo     -->
     <!--la parte de strong es para enfatizar que es algo fuerte yvuelve el  mensaje en  negrilla   -->
