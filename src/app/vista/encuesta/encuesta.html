<!-- 
  1. ESTADO DE CARGA INICIAL
  - Se muestra SOLO mientras isLoading es true (al entrar a la página).
  - Evita que el usuario vea una tabla vacía o rota mientras llegan los datos del backend.
  🔗 CONEXIÓN TS: this.isLoading = true/false en cargarEncuestas()
-->
<div *ngIf="isLoading" >
  <mat-spinner></mat-spinner>
  <p>Cargando encuestas...</p>
</div>
<div *ngIf="!isLoading" class="encuestas-lista">
  <div *ngFor="let encuesta of dataSource" class="encuesta-item">
    <h3>{{ encuesta.descripcion }}</h3>
    <p><strong>Código:</strong> {{ encuesta.codigo }}</p>
    <button mat-raised-button  (click)="realizarEncuesta(encuesta)">
       Realizar Encuesta
    </button>
  </div>
</div>
<app-tabla [data]="dataSource"></app-tabla>
