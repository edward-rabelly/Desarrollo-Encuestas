<div *ngIf="isLoading">
  <mat-spinner></mat-spinner>
  <p>Cargando usuarios...</p>
</div>

<!-- Tabla principal de usuarios -->
<app-tabla 
  *ngIf="!isLoading" 
  [data]="dataSource" 
  [mostrarBoton]="true" 
  [textoBoton]="'Ver Historial'" 
  [tituloColumnaAccion]="'Acción'"
  (filaSeleccionada)="verHistorial($event)">
</app-tabla>
