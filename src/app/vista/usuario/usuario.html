<table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%;">

  <!-- Columnas dinámicas automáticas -->
  <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
    
    <!-- Si es la columna de acciones, mostramos el botón -->
    <ng-container *ngIf="column === 'acciones'; else defaultColumn">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="primary" (click)="toggleUsuario(element)">
          <mat-icon>{{ isExpanded(element.id_usuario) ? 'expand_less' : 'expand_more' }}</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Para las demás columnas, mostramos el dato puro -->
    <ng-template #defaultColumn>
      <th mat-header-cell *matHeaderCellDef> {{ column | titlecase }} </th>
      <td mat-cell *matCellDef="let element"> {{ element[column] }} </td>
    </ng-template>
    
  </ng-container>

  <!-- Fila de cabecera -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  
  <!-- Fila de datos -->
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" 
      [class.expanded-row]="isExpanded(row.id_usuario)"
      (click)="toggleUsuario(row)">
  </tr>

  <!-- Fila expandida (Historial) -->
  <tr mat-row *matRowDef="let row; columns: ['historial']" class="detail-row"></tr>

  <!-- Definición de la columna de historial -->
  <ng-container matColumnDef="historial">
    <td mat-cell *matCellDef="let element" [attr.colspan]="displayedColumns.length">
      
      <!-- Solo se muestra si esta fila específica está expandida -->
      <div class="historial-content" *ngIf="isExpanded(element.id_usuario)" style="padding: 15px; background: #f9f9f9;">
        <h4 style="margin-top: 0;">Historial de Encuestas</h4>
        
        <!-- Si ya cargó el historial -->
        <div *ngIf="loadedHistory.has(element.id_usuario); else loading">
          <div *ngIf="getHistorial(element.id_usuario).length > 0; else noData">
            <ul style="list-style: none; padding: 0;">
              <li *ngFor="let item of getHistorial(element.id_usuario)" style="margin-bottom: 8px; padding: 8px; background: white; border-radius: 4px;">
                <strong>Encuesta:</strong> {{ item.codigoEncuesta }} <br>
                <strong>Fecha:</strong> {{ item.fecha }}
              </li>
            </ul>
          </div>
          <ng-template #noData>
            <p style="color: #666;">Este usuario aún no ha respondido encuestas.</p>
          </ng-template>
        </div>
        
        <ng-template #loading>
          <p style="color: #666;"><mat-icon style="vertical-align: middle; font-size: 16px;">sync</mat-icon> Cargando historial...</p>
        </ng-template>
        
      </div>
    </td>
  </ng-container>

</table>
